name: Release

# 署名設定が未整備のため、暫定でdebug署名のAPKを配布する。
# CIのdebug keystoreは実行ごとに変わるので、更新時はアンインストール→再インストールが必要になる場合がある。
# 正式な署名（release keystoreをSecretsで渡す）は今後の課題。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ランナー同梱のSDKに compileSdk 36 用のコンポーネントを確実に入れる
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Test and build
        run: ./gradlew :shared:testAndroidHostTest assembleDebug

      - name: Rename APK
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' androidApp/build.gradle.kts)"
          fi
          APK="lighthouse-keeper-${VERSION}-debug.apk"
          mv androidApp/build/outputs/apk/debug/androidApp-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          prerelease: true
          body: |
            個人利用向けのdebug署名ビルドです。
            CIごとに署名鍵が変わるため、上書きインストールできない場合は一度アンインストールしてから入れ直してください。
